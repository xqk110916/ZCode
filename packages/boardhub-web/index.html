<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161616" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>BoardHub</title>
    <script>
      (() => {
        // 与 packages/web/index.html 同一防白闪策略：JS bundle 执行前按本地主题偏好定首屏底色。
        const STORAGE_KEY = "zcode-theme";
        const DEFAULT_THEME = "zai-dark";
        try {
          const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
          const resolved =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : saved === "zai-dark"
                ? "dark"
                : saved === "zai-light"
                  ? "light"
                  : saved;
          const finalTheme = resolved === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-zcode-browser-theme-surface", finalTheme);
          document.documentElement.style.colorScheme = finalTheme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", finalTheme === "dark" ? "#161616" : "#f8f8f8");
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", finalTheme);
          if (finalTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--color-background, #161616);
        color: var(--color-foreground, #e2e8f0);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-zcode-browser-theme-surface="light"] body {
        background: var(--color-background, #f8f8f8);
        color: var(--color-foreground, #334155);
      }

      .boardhub-boot {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: var(--color-background, #161616);
        color: var(--color-foreground, #e2e8f0);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boardhub-boot" role="status" aria-live="polite">BoardHub 启动中…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
